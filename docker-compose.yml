# Local development services for ReadNest.
#   docker compose up -d db          -> PostgreSQL only (run the app with `dotnet run`)
#   docker compose --profile app up  -> PostgreSQL + the ReadNest container
name: readnest

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readnest}
      POSTGRES_USER: ${POSTGRES_USER:-readnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readnest_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - readnest-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-readnest};Username=${POSTGRES_USER:-readnest};Password=${POSTGRES_PASSWORD:-readnest_dev_password}"
      Database__ApplyMigrationsOnStartup: "true"
      Https__Redirect: "false"
      Catalog__GoogleBooks__ApiKey: ${GOOGLE_BOOKS_API_KEY:-}
      Catalog__OpenLibrary__ContactEmail: ${OPEN_LIBRARY_CONTACT_EMAIL:-}
      # Optional "Continue with Google"; leave unset to disable. Never commit real values.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Profile photos and uploaded PDF/EPUB files. Back this volume up together with the database.
      - readnest-files:/data

volumes:
  readnest-db:
  readnest-files:
