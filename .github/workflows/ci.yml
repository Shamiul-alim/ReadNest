name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ReadNest.sln

      - name: Build
        run: dotnet build ReadNest.sln --configuration Release --no-restore

      - name: Check migrations match the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/ReadNest.Infrastructure \
            --startup-project src/ReadNest.Infrastructure \
            --configuration Release --no-build

      - name: Unit tests
        run: >
          dotnet test tests/ReadNest.UnitTests
          --configuration Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Component tests
        run: >
          dotnet test tests/ReadNest.ComponentTests
          --configuration Release --no-build
          --logger "trx;LogFileName=component.trx" --results-directory TestResults

      # Integration tests start a real PostgreSQL container through Testcontainers,
      # using the Docker engine available on GitHub-hosted Ubuntu runners.
      - name: Integration tests
        run: >
          dotnet test tests/ReadNest.IntegrationTests
          --configuration Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
